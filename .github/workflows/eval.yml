# Exercise 7.3 — Quality gate: chạy eval trên golden dataset ở mỗi pull request.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có regression,
# nên step fail → job fail → branch protection ("Require status checks") chặn merge.
name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start agent v2
        # Tắt lỗi/độ chậm ngẫu nhiên để kết quả eval ổn định giữa các lần chạy
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 MOCK_SLOW_RATE=0 PORT=8000 python app.py &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Run eval (fail nếu accuracy < 85%)
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --out eval_ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: 06-lab-complete/benchmark-observability/develop/eval_ci.json
