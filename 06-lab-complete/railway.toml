# Railway: build bằng Dockerfile, health check /health.
# PORT do Railway cấp — CMD trong Dockerfile đã đọc ${PORT:-8000}.
# Secret (AGENT_API_KEY) và REDIS_URL đặt trong tab Variables, không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
